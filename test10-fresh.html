<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Test 10</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1830">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      background: #0B1830;
      overflow: hidden;
    }
    .shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .top, .bottom {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .top { top: 0; background: #E4572E; }
    .bottom { background: #2E6FE0; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="top" id="top">Test 10: altezze in PIXEL,<br>misurate via JavaScript<br>sull'altezza reale dello schermo.</div>
    <div class="bottom" id="bottom">Se ora è a schermo intero,<br>questa è la soluzione definitiva.</div>
  </div>
  <script>
    function layout() {
      var h = document.getElementById('shell').getBoundingClientRect().height;
      var topH = Math.round(h * 0.56);
      document.getElementById('top').style.height = topH + 'px';
      document.getElementById('bottom').style.top = topH + 'px';
      document.getElementById('bottom').style.height = (h - topH) + 'px';
    }
    layout();
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', function(){ setTimeout(layout, 150); });
  </script>
</body>
</html>
