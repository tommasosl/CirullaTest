<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Test 11</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1830">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      background: #0B1830;
      overflow: hidden;
    }
    .top, .bottom {
      position: fixed;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .top {
      top: 0;
      height: 56%;
      background: #E4572E;
    }
    .bottom {
      bottom: 0;
      height: 44%;
      background: #2E6FE0;
    }
  </style>
</head>
<body>
  <div class="top">Test 11: NESSUN contenitore genitore.<br>Due elementi indipendenti,<br>ciascuno position:fixed<br>direttamente sullo schermo.</div>
  <div class="bottom">Se ora è a schermo intero,<br>trovato il fix vero.</div>
</body>
</html>
