<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Test 9</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1830">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      background: #0B1830;
      overflow: hidden;
    }
    .shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(to bottom, #E4572E 0%, #E4572E 56%, #2E6FE0 56%, #2E6FE0 100%);
    }
    .top {
      flex: 0 0 56%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .bottom {
      flex: 0 0 44%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">Test 9: due blocchi flex (56/44)<br>ma TRASPARENTI.<br>Il colore/taglio arriva da un<br>gradiente sul contenitore esterno.</div>
    <div class="bottom">Se ora è a schermo intero,<br>abbiamo capito il vero fix.</div>
  </div>
</body>
</html>
