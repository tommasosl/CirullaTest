<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Test 6</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1830">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      background: #0B1830;
      overflow: hidden;
    }
    .shell {
      position: fixed;
      inset: 0;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .top {
      flex: 0 0 56%;
      background: #E4572E;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .bottom {
      flex: 0 0 44%;
      background: #2E6FE0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">Test 6: come il test 5,<br>ma con altezza ESPLICITA<br>(100dvh) sul contenitore,<br>non solo inset:0.</div>
    <div class="bottom">Se ora è a schermo intero,<br>abbiamo il fix definitivo.</div>
  </div>
</body>
</html>
