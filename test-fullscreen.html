<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Test Fullscreen</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2E6FE0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      background: #2E6FE0;
      overflow: hidden;
    }
    .box {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #E4572E 0%, #E4572E 50%, #2E6FE0 50%, #2E6FE0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="box">
    Se vedi TUTTO lo schermo colorato<br>(metà arancione, metà blu)<br>fino ai bordi, senza barre nere,<br>il test è superato.
  </div>
</body>
</html>
